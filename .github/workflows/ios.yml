name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  filter-tests:
    name: Filter tests (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tests/*.test.js

  build:
    name: Build iOS app
    runs-on: macos-15
    needs: filter-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild \
            -project Doomed.xcodeproj \
            -scheme Doomed \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            -quiet build

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project Doomed.xcodeproj \
            -scheme Doomed \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/Doomed.app Payload/
          # Ad-hoc signature that only carries the entitlements, so sideloading
          # tools (Sideloadly...) can see that the app needs Family Controls.
          codesign --force --sign - --entitlements Doomed/Doomed.entitlements Payload/Doomed.app
          codesign -d --entitlements - Payload/Doomed.app
          zip -qr Doomed-unsigned.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: Doomed-unsigned-ipa
          path: Doomed-unsigned.ipa
          retention-days: 30

  # Properly signed development build (keeps the Family Controls entitlement,
  # needed to block the native apps). Run it from the Actions tab once the
  # secrets below are set — see README "Build signé".
  signed:
    name: Signed development IPA
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    needs: filter-tests
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'org.doomed.app' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name (see README, section 'Build signé')"
              exit 1
            fi
          done

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write App Store Connect API key
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        run: |
          xcodebuild archive \
            -project Doomed.xcodeproj \
            -scheme Doomed \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Doomed.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            -quiet

      - name: Export development IPA
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Doomed.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          cp "$RUNNER_TEMP"/export/*.ipa Doomed-dev.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: Doomed-dev-ipa
          path: Doomed-dev.ipa
          retention-days: 30
